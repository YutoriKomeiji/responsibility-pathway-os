name: Deploy RPOS product site

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "site/**"
      - "formal/**"
      - "visuals/**"
      - "tests/**"
      - "tools/build_formal_assurance_manifest.py"
      - "tools/build_archify_visuals.sh"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "formal/**"
      - "visuals/**"
      - "tests/**"
      - "tools/build_formal_assurance_manifest.py"
      - "tools/build_archify_visuals.sh"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site, assurance, and architecture visuals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RPOS
        uses: actions/checkout@v4
      - name: Checkout pinned Archify fork
        uses: actions/checkout@v4
        with:
          repository: YutoriKomeiji/archify
          ref: 0853a805003514776bef3593ecca091409828902
          path: .archify-tool
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Archify dependencies
        run: npm ci --prefix .archify-tool/archify
      - name: Validate bilingual entry points, demo, and assurance surface
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/ja.html
          test -s site/demo.html
          test -s site/assurance.html
          test -s site/assurance.js
          test -s site/architecture.html
          test -s site/architecture-ja.html
          test -s site/styles.css
          test -s site/app.js
          test -s formal/assurance-catalog.json
          test -s tools/build_formal_assurance_manifest.py
          test -s tools/build_archify_visuals.sh
          test -s visuals/archify/rpos-responsibility-lifecycle.lifecycle.json
          test -s visuals/archify/rpos-operational-architecture.architecture.json
          test -s visuals/archify/rpos-assurance-evidence-flow.dataflow.json
          grep -F 'href="ja.html"' site/index.html
          grep -F 'href="index.html"' site/ja.html
          grep -F 'href="assurance.html"' site/index.html
          grep -F 'assurance.html?lang=ja' site/ja.html
          grep -F 'prefers-reduced-motion' site/styles.css
          grep -F 'does not execute the Python runtime' site/demo.html
          grep -F 'EFFECT_UNKNOWN' site/app.js
          grep -F 'commit-time authority revalidation' site/app.js
          grep -F 'public_assurance_not_runtime_authority' tools/build_formal_assurance_manifest.py
          python tools/build_formal_assurance_manifest.py --source-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/formal-assurance.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'formal-assurance.json').read_text(encoding='utf-8'))
          assert data['source_commit'] == os.environ['GITHUB_SHA']
          assert data['lean']['machine_checked'] is False
          assert data['assertion_count'] >= 6
          print('site assurance crosswalk references validated')
          PY
      - name: Validate and render pinned architecture visuals
        run: bash tools/build_archify_visuals.sh

  deploy:
    name: Deploy Pages with machine-checked assurance and verified visuals
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RPOS
        uses: actions/checkout@v4
      - name: Install pinned Lean toolchain via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Machine-check bounded RPOS formal project
        working-directory: formal/lean
        run: |
          lean --version
          lake --version
          lake build
      - name: Generate exact-head Formal Assurance manifest for the site
        run: |
          python tools/build_formal_assurance_manifest.py --source-commit "$GITHUB_SHA" --machine-checked --output site/formal-assurance.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('site/formal-assurance.json').read_text(encoding='utf-8'))
          assert data['source_commit'] == os.environ['GITHUB_SHA']
          assert data['lean']['machine_checked'] is True
          assert data['evidence_role'] == 'public_assurance_not_runtime_authority'
          print(f"Pages formal assurance bound to {data['source_commit']} with {data['assertion_count']} assertions")
          PY
      - name: Checkout pinned Archify fork
        uses: actions/checkout@v4
        with:
          repository: YutoriKomeiji/archify
          ref: 0853a805003514776bef3593ecca091409828902
          path: .archify-tool
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Archify dependencies
        run: npm ci --prefix .archify-tool/archify
      - name: Render verified architecture visuals into Pages artifact
        run: bash tools/build_archify_visuals.sh
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
