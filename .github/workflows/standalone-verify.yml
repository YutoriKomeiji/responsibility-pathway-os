name: RPOS standalone verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate exact-head public export evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('PUBLIC-EXPORT-EVIDENCE.json').read_text(encoding='utf-8'))
          assert baseline['schema_version'] == 'rpos.public-export.evidence.v0.1'
          assert baseline['release_candidate'] == '0.1.0a1'
          assert baseline['file_count'] == 106
          assert set(baseline['excluded_roots']) == {'decisions', 'patent', 'research', 'review'}
          print('preserved migration baseline policy verified')
          PY
          python tools/build_public_export_manifest.py --source-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/rpos-public-export.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'rpos-public-export.json').read_text(encoding='utf-8'))
          assert manifest['source_commit'] == os.environ['GITHUB_SHA']
          assert manifest['file_count'] >= 106
          paths = {item['path'] for item in manifest['files']}
          required = {
              'CHANGELOG.md','CONTRIBUTING.md','SUPPORT.md','CODE_OF_CONDUCT.md','product-status.json',
              'formal/lean/lakefile.toml','formal/lean/lean-toolchain',
              'tests/test_field_acceptance.py','tests/test_product_status.py','tests/test_cli_bom.py',
              'examples/idempotency_replay_guard.py','examples/human_return_reauthorization.py',
              'examples/adapter_exception_containment.py','examples/reconciliation_unresolved_human_return.py',
              'tools/build_public_export_manifest.py',
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f'current public export omits product-quality files: {missing}')
          forbidden_roots = {'decisions','patent','research','review'}
          leaked = sorted(path for path in paths if Path(path).parts[0] in forbidden_roots)
          if leaked:
              raise SystemExit(f'private roots leaked: {leaked}')
          print(f"exact-head public export verified: {manifest['file_count']} files")
          PY
      - name: Install package and verification tooling from standalone boundary
        run: |
          python -m pip install --upgrade pip build pytest
          python -m pip install .
      - name: Run standalone tests
        run: python -m pytest -q tests
      - name: Run all source examples
        run: |
          for f in examples/*.py; do
            echo "==> $f"
            PYTHONPATH=src python "$f"
          done
      - name: Build wheel and sdist
        run: python -m build
      - name: Clean-install wheel and verify installed API boundary
        run: |
          python -m venv "$RUNNER_TEMP/rpos-wheel"
          "$RUNNER_TEMP/rpos-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/rpos-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/rpos-wheel/bin/rpos" --help
          "$RUNNER_TEMP/rpos-wheel/bin/python" - <<'PY'
          import rpos
          assert hasattr(rpos, 'ResponsibilityStateEnvelope')
          assert hasattr(rpos, 'validate_envelope')
          assert hasattr(rpos, 'ResponsibilityPacket')
          assert hasattr(rpos, 'validate_packet')
          assert hasattr(rpos, 'ResponsibilityObservation')
          assert hasattr(rpos, 'ResponsibilityObservatory')
          assert hasattr(rpos, 'TransparencyEnvelope')
          assert hasattr(rpos, 'TransparencyStatus')
          assert hasattr(rpos, 'AIInteractionDisclosure')
          assert hasattr(rpos, 'SyntheticContentProvenance')
          assert hasattr(rpos, 'HumanEditorialResponsibility')
          new = {
              'schema_version': 'rpos.responsibility-state-envelope.v0.1',
              'template_kind': 'human_gate_decision',
              'authority_effect': 'none',
              'payload': {'operation_id':'op-1','decision':'approved','decision_actor':'human','decision_reason':'test'},
          }
          legacy = dict(new)
          legacy['schema_version'] = 'rpos.packet.v0.1'
          a = rpos.validate_envelope(new)
          b = rpos.validate_packet(legacy)
          assert a.template_kind == b.template_kind
          assert a.authority_effect == b.authority_effect == 'none'
          print('new/legacy envelope, Observatory, and transparency APIs verified from installed wheel')
          PY
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/rpos-wheel/bin/python" "$GITHUB_WORKSPACE/examples/quick_start_end_to_end.py")
      - name: Clean-install sdist and verify installed API boundary
        run: |
          python -m venv "$RUNNER_TEMP/rpos-sdist"
          "$RUNNER_TEMP/rpos-sdist/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/rpos-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/rpos-sdist/bin/rpos" --help
          "$RUNNER_TEMP/rpos-sdist/bin/python" - <<'PY'
          import rpos
          assert hasattr(rpos, 'ResponsibilityStateEnvelope')
          assert hasattr(rpos, 'validate_envelope')
          assert hasattr(rpos, 'ResponsibilityPacket')
          assert hasattr(rpos, 'validate_packet')
          assert hasattr(rpos, 'ResponsibilityObservation')
          assert hasattr(rpos, 'ResponsibilityObservatory')
          assert hasattr(rpos, 'TransparencyEnvelope')
          assert hasattr(rpos, 'TransparencyStatus')
          print('new/legacy envelope, Observatory, and transparency APIs import from installed sdist')
          PY
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/rpos-sdist/bin/python" "$GITHUB_WORKSPACE/examples/quick_start_end_to_end.py")
      - name: Generate and validate standalone SBOM
        run: |
          python -m rpos.sbom --help
          python -m rpos.sbom pyproject.toml --source-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/rpos-sbom.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'rpos-sbom.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['bomFormat'] == 'CycloneDX'
          assert data['specVersion'] == '1.6'
          assert data['metadata']['component']['name'] == 'responsibility-pathway-os'
          print('CycloneDX SBOM structure verified')
          PY
      - name: Scan source boundary for likely committed secrets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          roots = ['src','tests','examples','templates','formal','docs','specs','provenance','tools']
          patterns = [
              re.compile(r'AKIA[0-9A-Z]{16}'),
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'gh[pousr]_[A-Za-z0-9]{30,}'),
              re.compile(r'sk-[A-Za-z0-9_-]{20,}'),
          ]
          hits=[]
          for root in roots:
              for p in Path(root).rglob('*'):
                  if not p.is_file() or p.suffix in {'.pyc','.olean'}: continue
                  text=p.read_text(encoding='utf-8', errors='ignore')
                  for pat in patterns:
                      if pat.search(text): hits.append((str(p), pat.pattern))
          if hits: raise SystemExit(f'likely secrets found: {hits}')
          print('no likely committed secret patterns found')
          PY
      - name: Upload exact-head product evidence
        uses: actions/upload-artifact@v4
        with:
          name: rpos-product-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rpos-public-export.json
            ${{ runner.temp }}/rpos-sbom.json
          if-no-files-found: error
          retention-days: 14

  lean-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Record pinned Lean and Lake versions
        working-directory: formal/lean
        run: |
          lean --version
          lake --version
      - name: Build bounded RPOS formal project
        working-directory: formal/lean
        run: lake build
