name: Apply verified private RPOS refresh

on:
  push:
    branches:
      - migration/refresh-0.1.0a1-20260812
    paths:
      - .migration/payload.part*
      - .github/workflows/apply-private-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/refresh-0.1.0a1-20260812
          fetch-depth: 0
      - name: Decode and verify transfer payload
        run: |
          cat .migration/payload.part00 .migration/payload.part01 .migration/payload.part02 .migration/payload.part03 .migration/payload.part04 .migration/payload.part05 .migration/payload.part06 .migration/payload.part07 .migration/payload.part08 | base64 -d > "$RUNNER_TEMP/rpos-refresh-payload.tar.gz"
          echo "53ca5475c708d0472eadef6b5fd2b260d75336a3946e5e23fd7d4d4e5eb7c2c8  $RUNNER_TEMP/rpos-refresh-payload.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/payload"
          tar -xzf "$RUNNER_TEMP/rpos-refresh-payload.tar.gz" -C "$RUNNER_TEMP/payload"
      - name: Verify payload lineage and apply only declared product changes
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          import os

          repo = Path('.')
          payload = Path(os.environ['RUNNER_TEMP']) / 'payload'
          meta = json.loads((payload / 'MIGRATION-PAYLOAD-META.json').read_text(encoding='utf-8'))
          assert meta['schema'] == 'rpos.private-refresh-payload.v0.1'
          assert meta['source_rpp_commit'] == '738635b74b4171e87bbdf437513362fcf3110515'
          assert meta['verified_candidate_tree'] == 'b8f74e082537d509c9a27b048ed819bbe6edbf59'
          assert meta['previous_standalone_main'] == 'eabde10e43b3b9450aadbe31001a2c266f0b4c65'
          assert meta['public_human_gate'] == 'HOLD'

          for rel in meta['changed_paths']:
              src = payload / rel
              assert src.is_file(), rel
              dst = repo / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          shutil.copy2(payload / 'PUBLIC-EXPORT-EVIDENCE.json', repo / 'PUBLIC-EXPORT-EVIDENCE.json')

          evidence = json.loads((repo / 'PUBLIC-EXPORT-EVIDENCE.json').read_text(encoding='utf-8'))
          expected = {item['path']: item['sha256'] for item in evidence['files']}
          assert len(expected) == evidence['file_count'] == 98
          bad = []
          for rel, want in expected.items():
              p = repo / rel
              if not p.is_file():
                  bad.append((rel, 'missing', want))
                  continue
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != want:
                  bad.append((rel, got, want))
          if bad:
              raise SystemExit(f'post-apply manifest mismatch: {bad}')

          for forbidden in ('review', 'research', 'patent', 'decisions'):
              if (repo / forbidden).exists():
                  raise SystemExit(f'forbidden private root present: {forbidden}')
          print(f'clean export manifest verified: {len(expected)} files')
          PY
      - name: Run pre-commit smoke verification
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install .
          python -m pytest -q tests
          python - <<'PY'
          import rpos
          assert hasattr(rpos, 'ResponsibilityStateEnvelope')
          assert hasattr(rpos, 'validate_envelope')
          assert hasattr(rpos, 'ResponsibilityPacket')
          assert hasattr(rpos, 'validate_packet')
          print('preferred and backward-compatible API names present')
          PY
      - name: Clean verification workspace and validate staged boundary
        run: |
          rm -rf build dist
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          find src -maxdepth 1 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          rm -rf .migration

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --name-only | grep -E '(^|/)(build|dist|__pycache__)(/|$)|\.egg-info(/|$)|\.(pyc|pyo)$'; then
            echo 'generated verification artifact reached staged candidate' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -E '^\.github/workflows/'; then
            echo 'workflow change reached Actions self-push boundary' >&2
            exit 1
          fi
          git diff --cached --check
          echo 'staged candidate:'
          git diff --cached --name-status
      - name: Commit clean private standalone candidate
        run: |
          git commit -m "Refresh private standalone from verified RPP candidate"
          git push origin HEAD:migration/refresh-0.1.0a1-20260812
