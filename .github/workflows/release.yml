name: RPOS release candidate

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact version expected from pyproject.toml
        required: true
        default: "0.1.0a1"
        type: string
      publish:
        description: Publish verified distributions to PyPI
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "README.md"
      - "README.ja.md"
      - "product-status.json"
      - "formal/**"
      - "tests/**"
      - "site/assurance.html"
      - "site/assurance.js"
      - "src/rpos/sbom.py"
      - "src/rpos/hash_bundle.py"
      - "tools/build_public_export_manifest.py"
      - "tools/build_formal_assurance_manifest.py"

permissions:
  contents: read

env:
  RPOS_EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_version || '0.1.0a1' }}

jobs:
  formal-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate assurance catalog references
        run: python tools/build_formal_assurance_manifest.py --source-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/precheck.json"
      - name: Install pinned Lean toolchain via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Machine-check bounded Lean project
        working-directory: formal/lean
        run: |
          lean --version
          lake --version
          lake build
      - name: Generate exact-head formal assurance manifest
        run: |
          python tools/build_formal_assurance_manifest.py --source-commit "$GITHUB_SHA" --machine-checked --output "$RUNNER_TEMP/formal-assurance.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'formal-assurance.json').read_text(encoding='utf-8'))
          assert data['source_commit'] == os.environ['GITHUB_SHA']
          assert data['lean']['machine_checked'] is True
          assert data['evidence_role'] == 'public_assurance_not_runtime_authority'
          assert data['assertion_count'] >= 6
          print('release formal assurance is machine-checked and exact-head bound')
          PY
      - name: Upload exact-head formal assurance evidence
        uses: actions/upload-artifact@v4
        with:
          name: rpos-formal-assurance-${{ github.sha }}
          path: ${{ runner.temp }}/formal-assurance.json
          if-no-files-found: error
          retention-days: 30

  build-and-verify:
    needs: formal-assurance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tooling and package
        run: |
          python -m pip install --upgrade pip build twine pytest
          python -m pip install .
      - name: Verify requested version and release metadata
        env:
          EXPECTED_VERSION: ${{ env.RPOS_EXPECTED_VERSION }}
        run: |
          python - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          expected = os.environ['EXPECTED_VERSION']
          with Path('pyproject.toml').open('rb') as fh:
              project = tomllib.load(fh)['project']
          actual = project['version']
          if actual != expected:
              raise SystemExit(f'version mismatch: requested={expected!r}, project={actual!r}')
          for readme in ('README.md', 'README.ja.md'):
              text = Path(readme).read_text(encoding='utf-8')
              required = (
                  f'RPOS-DOC-VERSION: {actual}',
                  f'Version: **{actual} candidate',
                  f'responsibility-pathway-os=={actual}',
              )
              missing = [marker for marker in required if marker not in text]
              if missing:
                  raise SystemExit(f'{readme} version markers missing: {missing}')
          status = json.loads(Path('product-status.json').read_text(encoding='utf-8'))
          if status['version'] != actual or status['publication_state'] != 'not_published':
              raise SystemExit('product-status release identity/boundary mismatch')
          if status['production_ready'] is not False:
              raise SystemExit('public alpha must not claim production readiness')
          print(f'release identity verified for responsibility-pathway-os=={actual}')
          PY
      - name: Run standalone Python tests
        run: python -m pytest -q tests
      - name: Build distributions once
        run: python -m build
      - name: Validate rendered package metadata
        env:
          EXPECTED_VERSION: ${{ env.RPOS_EXPECTED_VERSION }}
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import email
          import glob
          import os
          import tarfile
          import zipfile

          expected_name = 'responsibility-pathway-os'
          expected_version = os.environ['EXPECTED_VERSION']
          wheels = glob.glob('dist/*.whl')
          sdists = glob.glob('dist/*.tar.gz')
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f'expected exactly one wheel and one sdist: wheels={wheels}, sdists={sdists}')

          with zipfile.ZipFile(wheels[0]) as zf:
              metadata_name = next(name for name in zf.namelist() if name.endswith('.dist-info/METADATA'))
              metadata = email.message_from_bytes(zf.read(metadata_name))
          if metadata['Name'] != expected_name or metadata['Version'] != expected_version:
              raise SystemExit(f'wheel metadata mismatch: Name={metadata["Name"]!r}, Version={metadata["Version"]!r}')

          with tarfile.open(sdists[0], 'r:gz') as tf:
              pkg_info_name = next(name for name in tf.getnames() if name.endswith('/PKG-INFO'))
              member = tf.extractfile(pkg_info_name)
              if member is None:
                  raise SystemExit('sdist PKG-INFO missing')
              metadata = email.message_from_bytes(member.read())
          if metadata['Name'] != expected_name or metadata['Version'] != expected_version:
              raise SystemExit(f'sdist metadata mismatch: Name={metadata["Name"]!r}, Version={metadata["Version"]!r}')
          print('wheel and sdist metadata agree with requested release identity')
          PY
      - name: Download exact-head formal assurance evidence
        uses: actions/download-artifact@v4
        with:
          name: rpos-formal-assurance-${{ github.sha }}
          path: release-evidence/
      - name: Generate exact-head release evidence
        run: |
          mkdir -p release-evidence
          python tools/build_public_export_manifest.py --source-commit "$GITHUB_SHA" --output release-evidence/public-export-manifest.json
          python -m rpos.sbom pyproject.toml --source-commit "$GITHUB_SHA" --output release-evidence/sbom.cdx.json
          python -m rpos.hash_bundle dist/* release-evidence/public-export-manifest.json release-evidence/sbom.cdx.json release-evidence/formal-assurance.json --source-commit "$GITHUB_SHA" --output release-evidence/release-hashes.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = os.environ['GITHUB_SHA']
          manifest = json.loads(Path('release-evidence/public-export-manifest.json').read_text(encoding='utf-8'))
          sbom = json.loads(Path('release-evidence/sbom.cdx.json').read_text(encoding='utf-8'))
          assurance = json.loads(Path('release-evidence/formal-assurance.json').read_text(encoding='utf-8'))
          hashes = json.loads(Path('release-evidence/release-hashes.json').read_text(encoding='utf-8'))
          assert manifest['source_commit'] == expected
          props = {x['name']: x['value'] for x in sbom['metadata']['component']['properties']}
          assert props['rpos:source-commit'] == expected
          assert assurance['source_commit'] == expected
          assert assurance['lean']['machine_checked'] is True
          assert assurance['evidence_role'] == 'public_assurance_not_runtime_authority'
          assert hashes['source_commit'] == expected
          names = {item['name'] for item in hashes['artifacts']}
          assert any(name.endswith('.whl') for name in names)
          assert any(name.endswith('.tar.gz') for name in names)
          assert {'public-export-manifest.json', 'sbom.cdx.json', 'formal-assurance.json'} <= names
          print('release evidence, including machine-checked formal assurance, is source-bound to exact workflow HEAD')
          PY
      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: rpos-${{ env.RPOS_EXPECTED_VERSION }}-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-bound release evidence
        uses: actions/upload-artifact@v4
        with:
          name: rpos-${{ env.RPOS_EXPECTED_VERSION }}-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

  python-compatibility:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test declared Python / OS combination
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pytest -q tests
          rpos --help

  publish-pypi:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [build-and-verify, python-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/responsibility-pathway-os
    permissions:
      id-token: write
    steps:
      - name: Download the exact verified distributions
        uses: actions/download-artifact@v4
        with:
          name: rpos-${{ env.RPOS_EXPECTED_VERSION }}-dist
          path: dist/
      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
